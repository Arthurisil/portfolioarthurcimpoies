<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographie | Arthur Cimpoies</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-900 font-sans" id="body">
    <div id="bg-animation-container"></div>

    <nav id="navbar" class="fixed w-full top-6 z-50 px-4 nav-drop">
        <div class="max-w-6xl mx-auto bg-white/90 backdrop-blur-md shadow-2xl rounded-2xl border border-gray-100 px-8 py-4 flex justify-between items-center">
            <a href="portfolio.html" class="text-2xl font-black text-blue-600">Portfolio</a>
            
            <div class="hidden md:flex space-x-8 items-center">
                <a href="portfolio.html#perso" class="font-medium hover:text-blue-600 transition">À propos de moi</a>			
                <a href="portfolio.html#projets" class="font-medium hover:text-blue-600 transition">Réalisations</a>
                <a href="portfolio.html#competences" class="font-medium hover:text-blue-600 transition">Compétences</a>
                <a href="portfolio.html#interet" class="font-medium hover:text-blue-600 transition">Centres d'intérêt</a>
                <a href="contact.html" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-blue-700 transition-all">Me contacter</a>
            </div>
        </div>
    </nav>

	 <main class="pt-48 pb-24 px-6 max-w-6xl mx-auto">
		<div class="text-center mb-16">
			<h1 class="text-5xl font-extrabold mb-4 text-gray-900">Photographie</h1>
			<div class="h-1.5 w-20 bg-blue-600 mx-auto rounded-full"></div>
			<p class="mt-6 text-lg text-gray-600">Découvrez mon regard à travers l'objectif.</p>
		</div>

	<section class="max-w-xl mx-auto relative group">
		<div class="relative h-auto overflow-hidden rounded-[2.5rem] shadow-2xl border border-gray-100 bg-gray-900 transition-all duration-500">				
			
			<div class="slide duration-700 ease-in-out">
				<img src="photo/photographie/photo.jpg" class="w-full h-auto block">
				<div class="absolute bottom-0 w-full p-10 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
					<p class="font-bold text-2xl">Paysage de montagne</p>
				</div>
			</div>

			<div class="slide hidden duration-700 ease-in-out">
				<img src="photo/photographie/photo3.jpg" class="w-full h-auto block">
				<div class="absolute bottom-0 w-full p-10 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
					<p class="font-bold text-2xl">Immersion artistique</p>
				</div>
			</div>

			<div class="slide hidden duration-700 ease-in-out">
				<img src="photo/photographie/photo2.jpg" class="w-full h-auto block">
				<div class="absolute bottom-0 w-full p-10 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
					<p class="font-bold text-2xl">Immersion artistique</p>
				</div>
			</div>

			<div class="slide hidden duration-700 ease-in-out">
				<img src="photo/photographie/photo4.jpg" class="w-full h-auto block">
				<div class="absolute bottom-0 w-full p-10 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
					<p class="font-bold text-2xl">Immersion artistique</p>
				</div>
			</div>						

			<div class="slide hidden duration-700 ease-in-out">
				<img src="photo/photographie/photo1.jpg" class="w-full h-auto block">
				<div class="absolute bottom-0 w-full p-10 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
					<p class="font-bold text-2xl">Concert</p>
				</div>
			</div>
		</div>

		<button onclick="changeSlide(-1)" class="absolute top-1/2 -left-12 -translate-y-1/2 bg-white shadow-xl p-4 rounded-full text-blue-600 hover:scale-110 transition-all opacity-0 group-hover:opacity-100 z-10">
			<i class="fas fa-chevron-left text-xl"></i>
		</button>
		<button onclick="changeSlide(1)" class="absolute top-1/2 -right-12 -translate-y-1/2 bg-white shadow-xl p-4 rounded-full text-blue-600 hover:scale-110 transition-all opacity-0 group-hover:opacity-100 z-10">
			<i class="fas fa-chevron-right text-xl"></i>
		</button>

		<div class="flex justify-center space-x-3 mt-10">
			<div class="dot w-3 h-3 rounded-full bg-blue-600 transition-all duration-300"></div>
			<div class="dot w-3 h-3 rounded-full bg-gray-300 transition-all duration-300"></div>
			<div class="dot w-3 h-3 rounded-full bg-gray-300 transition-all duration-300"></div>
			<div class="dot w-3 h-3 rounded-full bg-gray-300 transition-all duration-300"></div>
			<div class="dot w-3 h-3 rounded-full bg-gray-300 transition-all duration-300"></div>			
		</div>
	</section>
	</main>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        function changeSlide(direction) {
            slides[currentSlide].classList.add('hidden');
            dots[currentSlide].classList.replace('bg-blue-600', 'bg-gray-300');

            currentSlide = (currentSlide + direction + slides.length) % slides.length;

            slides[currentSlide].classList.remove('hidden');
            dots[currentSlide].classList.replace('bg-gray-300', 'bg-blue-600');
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
